name: publish

on:
  push:
  # Started by ocelot.social's docker-push workflow whenever the branch release-please keeps for the
  # next release has its images in the registry: stage runs what the next release will be. It
  # passes that commit's immutable `sha-<40 hex>` tag, which wins over $OCELOT_VERSION in .env;
  # by hand, leave it empty to build on .env's version.
  workflow_dispatch:
    inputs:
      ocelot-version:
        description: ocelot.social image tag to build on (empty = OCELOT_VERSION from .env)
        required: false
        type: string

# One build per ref at a time, the newest wins: ocelot.social dispatches on every merge, and an
# older build finishing last would point the branch tag back at older images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-images:
    strategy:
      matrix:
        app:
          - name: backend
            file: docker/backend.Dockerfile
          - name: webapp
            file: docker/webapp.Dockerfile
          - name: maintenance
            file: docker/maintenance.Dockerfile
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.1.7
      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read $OCELOT_VERSION from file
        run: cat .env >> $GITHUB_ENV
      - name: Take the dispatched ocelot.social version over .env's
        if: inputs.ocelot-version != ''
        env:
          DISPATCHED: ${{ inputs.ocelot-version }}
        run: echo "OCELOT_VERSION=${DISPATCHED}" >> "$GITHUB_ENV"
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@70b2cdc6480c1a8b86edf1777157f8f437de2166
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            ocelot-version=${{ env.OCELOT_VERSION }}
      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          file:  ${{ matrix.app.file }}
          context: ${{ matrix.app.context || '.' }}
          push: true
          build-args: |
              OCELOT_VERSION=${{ env.OCELOT_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build-and-push-images
    steps:
      - uses: mdgreenwald/mozilla-sops-action@d9714e521cbaecdae64a89d2fdd576dd2aa97056 # v1.6.0
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.1.7
      - run: |
          mkdir -p ~/.config/sops/age
          echo $SOPS_KEY | base64 --decode > ~/.config/sops/age/keys.txt
        env:
          SOPS_KEY: ${{ secrets.SOPS_KEY }}
      - run: |
          mkdir -p ~/.kube
          sops decrypt ./helmfile/secrets/kubeconfig > ~/.kube/config
          chmod 600 ~/.kube/config
      - uses: helmfile/helmfile-action@80fbb6408b98822310f94d8d1321a2cacf87f78f #v1.9.2
        with:
          helmfile-args: apply
          helmfile-workdirectory: ./helmfile
          helm-plugins: >
            https://github.com/databus23/helm-diff,
            https://github.com/jkroepke/helm-secrets,
            https://github.com/aslafy-z/helm-git
