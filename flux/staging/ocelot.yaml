apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stage-ocelot-social-ocelot
  namespace: flux-system
spec:
  interval: 10m
  # The release helmfile created, taken over in place.
  releaseName: ocelot-social
  targetNamespace: ocelot-staging
  storageNamespace: ocelot-staging
  install:
    createNamespace: true
  dependsOn:
    - name: stage-ocelot-social-neo4j
  chart:
    spec:
      chart: ./deployment/helm/charts/ocelot-social
      sourceRef:
        kind: GitRepository
        name: stage-ocelot-social-charts
      reconcileStrategy: Revision
  # secrets.* of the chart (JWT, S3, SMTP, imagor, Mapbox, LiveKit, ACME e-mail).
  valuesFrom:
    - kind: Secret
      name: stage-ocelot-social-values
      valuesKey: values.yaml
  values:
    domain: stage.ocelot.social
    redirect_domains: []
    cert_manager:
      issuer: ocelot-social-letsencrypt-prod
    underMaintenance: false
    global:
      image:
        # The newest image build of this repo's master, written by publish.yml (roll-out-staging).
        tag: master-1023-9bd14f2 # image tag: written by publish.yml
        pullPolicy: Always
    backend:
      image:
        repository: ghcr.io/ocelot-social-community/stage.ocelot.social/backend
      env:
        NEO4J_URI: bolt://ocelot-neo4j-neo4j:7687
        # stage may be wiped and reseeded, by hand only (scripts/reseed.sh; seed.yaml is suspended).
        # The jobs read it from the backend's config map, never set it themselves.
        DB_WIPE_ALLOWED: "true"
        PUBLIC_REGISTRATION: "true"
        INVITE_REGISTRATION: "true"
        CATEGORIES_ACTIVE: "true"
        MAX_PINNED_POSTS: "1"
        MAX_GROUP_PINNED_POSTS: "1"
        BADGES_ENABLED: "true"
        API_KEYS_ENABLED: "true"
        API_KEYS_MAX_PER_USER: "5"
        ASK_FOR_REAL_NAME: "false"
        REQUIRE_LOCATION: "false"
        SHOW_CONTENT_FILTER_HEADER_MENU: "false"
        SHOW_CONTENT_FILTER_MASONRY_GRID: "true"
        SHOW_GROUP_BUTTON_IN_HEADER: "true"
        # Contact identity: e-mail/link config, not brand design, so ENV rather than branding.
        SUPPORT_EMAIL: hello@ocelot.social
        SUPPORT_LINK: https://ocelot.social
        ORGANIZATION_LINK: https://ocelot.social
    webapp:
      image:
        repository: ghcr.io/ocelot-social-community/stage.ocelot.social/webapp
      env:
        NETWORK_NAME: stage.ocelot.social
    maintenance:
      image:
        repository: ghcr.io/ocelot-social-community/stage.ocelot.social/maintenance
      env:
        SUPPORT_EMAIL: hello@ocelot.social
    neo4j:
      image:
        repository: ghcr.io/ocelot-social-community/ocelot-social/neo4j
        tag: master
      storage: 5Gi
      storageBackups: 10Gi
      resources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
