# Reseeding stage: wipes the database and seeds the demo data. By hand only — scripts/reseed.sh
# runs a Job off this CronJob's template, which stays suspended. The backend picks up the new roles
# and policies by itself within a minute (its periodic cache resync), no restart needed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reseed
  namespace: ocelot-staging
spec:
  suspend: true
  schedule: "0 4 * * 1"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reseed
              # The build stage of backend.Dockerfile: the seed needs tsx and faker, which the runtime
              # image does not ship. Same build as the running backend (ocelot.yaml).
              image: ghcr.io/ocelot-social-community/stage.ocelot.social/backend-seed:master-966-37fa46e # image tag: written by publish.yml
              # Refuses unless the instance allows it (DB_WIPE_ALLOWED in the backend's config map): the
              # same job applied to a production namespace finds it off there and wipes nothing.
              command:
                - /bin/sh
                - -c
                - >-
                  if [ "$DB_WIPE_ALLOWED" != true ]; then
                  echo "DB_WIPE_ALLOWED is not true for this instance, refusing to wipe it" >&2; exit 1;
                  fi && npm run db:reset && npm run db:seed
              envFrom:
                # The running backend's configuration: database, S3, Mapbox, …
                - configMapRef:
                    name: ocelot-social-backend-env
                - secretRef:
                    name: ocelot-social-backend-secret-env
              # The seed sends no mail itself (#10930), so no NODE_ENV override.
              env:
                # Set by the chart on the backend's container, not in its config map, so not in envFrom
                # above. The config requires IMAGOR_PUBLIC_URL at load, and the seed refuses to start without it.
                - name: IMAGOR_PUBLIC_URL
                  value: https://stage.ocelot.social/imagor
                - name: CLIENT_URI
                  value: https://stage.ocelot.social
